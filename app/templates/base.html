<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Strava Group KM Tracker{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
      background: #fafafa;
    }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-top: 0; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; table-layout: fixed; }
    .table-wrap { overflow-x: auto; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid #ddd; }
    th { color: #555; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:first-child td { font-weight: 600; }
    .rank { width: 2.5rem; color: #999; text-align: center; }
    .medal { display: inline-block; line-height: 1; vertical-align: middle; font-size: 1.1rem; }
    .km { width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; }
    .ran-today { width: 2rem; text-align: center; }
    .ran-today-arrow { color: rgba(46, 125, 50, 0.55); font-size: 1.2rem; line-height: 1; }
    .track-col { width: 45%; }
    .lane { position: relative; height: 1.4rem; min-width: 150px; }
    .lane::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #ddd;
      transform: translateY(-50%);
    }
    .lane-start {
      position: absolute;
      left: 0;
      top: 50%;
      width: 2px;
      height: 0.7rem;
      background: #bbb;
      transform: translateY(-50%);
    }
    .lane-finish {
      position: absolute;
      right: -0.1rem;
      top: 50%;
      font-size: 0.95rem;
      line-height: 1;
      transform: translateY(-50%);
    }
    .runner {
      position: absolute;
      top: 50%;
      font-size: 1.15rem;
      line-height: 1;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .error-badge {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.1rem 0.4rem;
      font-size: 0.75rem;
      background: #fde2e2;
      color: #a12525;
      border-radius: 4px;
    }
    .connect-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.1rem;
      background: #fc4c02;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    .connect-btn:hover { background: #e04502; }
    .flash { padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1rem; }
    .flash-success { background: #e3f6e5; color: #1f6d2b; }
    .flash-error { background: #fde2e2; color: #a12525; }
    .empty-state { color: #666; margin-top: 1.5rem; }
    .last-updated { color: #999; font-size: 0.85rem; margin-top: 1.5rem; }
    .rotate-prompt { display: none; }
    @media screen and (max-width: 600px) and (orientation: portrait) {
      .rotate-prompt {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #fafafa;
        color: #222;
      }
      .rotate-icon {
        font-size: 3rem;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }
    }
  </style>
</head>
<body>
  <div class="rotate-prompt" aria-hidden="true">
    <div class="rotate-icon">📱</div>
    <p>Please rotate your phone to landscape to view the leaderboard.</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
